<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Font Tester</title>
<style>
/* -------------------- Fonts -------------------- */
@font-face { font-family: Regular; src: url("../fonts/ttf/Kierkegaard-Regular.ttf"); }
@font-face { font-family: Italic; src: url("../fonts/ttf/Kierkegaard-Italic.ttf"); }
@font-face { font-family: SemiBold; src: url("../fonts/ttf/Kierkegaard-SemiBold.ttf"); }
@font-face { font-family: SemiBoldItalic; src: url("../fonts/ttf/Kierkegaard-SemiBoldItalic.ttf"); }
@font-face { font-family: ExtraBold; src: url("../fonts/ttf/Kierkegaard-ExtraBold.ttf"); }
@font-face { font-family: ExtraBoldItalic; src: url("../fonts/ttf/Kierkegaard-ExtraBoldItalic.ttf"); }

/* -------------------- Grundlayout -------------------- */
body {
    font-family: sans-serif;
    margin: 20px;
    background: #f5f5f5;
}
.container {
    max-width: 900px;
    margin: 0 auto;
}
.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 20px;
    background: #fff;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
.controls label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}
.controls select, .controls input[type="range"] {
    width: 150px;
}
.features {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}
.features label {
    font-weight: normal;
}

/* -------------------- Beispieltext -------------------- */
.font-edit-container {
    background: #fff;
    padding: 20px;
    min-height: 200px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    overflow-y: auto;
}
.font-edit-container[contenteditable="true"] {
    outline: 2px dashed #ccc;
    cursor: text;
}

/* Slider Styling */
input[type="range"] {
    -webkit-appearance: none;
    height: 5px;
    background: #ddd;
    border-radius: 5px;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    background: #666;
    border-radius: 50%;
    cursor: pointer;
}
</style>
</head>
<body>
<div class="container">

    <div class="controls">
        <!-- Font Family -->
        <div>
            <label for="fontFamily">Font Family</label>
            <select id="fontFamily">
                <option value="Regular">Regular</option>
                <option value="Italic">Italic</option>
                <option value="SemiBold">SemiBold</option>
                <option value="SemiBoldItalic">SemiBoldItalic</option>
                <option value="ExtraBold">ExtraBold</option>
                <option value="ExtraBoldItalic">ExtraBoldItalic</option>
            </select>
        </div>

        <!-- Font Size -->
        <div>
            <label for="fontSize">Font Size (<span id="fontSizeVal">24</span>px)</label>
            <input type="range" id="fontSize" min="8" max="72" value="24">
        </div>

        <!-- Line Height -->
        <div>
            <label for="lineHeight">Line Height (<span id="lineHeightVal">1.5</span>)</label>
            <input type="range" id="lineHeight" min="1" max="3" step="0.1" value="1.5">
        </div>

        <!-- OpenType Features -->
        <div>
            <label>OpenType Features</label>
            <div class="features">
                <label><input type="checkbox" class="feature" value="liga"> liga</label>
                <label><input type="checkbox" class="feature" value="dlig"> dlig</label>
                <label><input type="checkbox" class="feature" value="smcp"> smcp</label>
                <label><input type="checkbox" class="feature" value="calt"> calt</label>
            </div>
        </div>
    </div>

    <!-- Editable Text -->
    <div class="font-edit-container" contenteditable="true">
        Dies ist ein editierbarer Beispieltext. Ändere die Schriftart, Größe, Zeilenhöhe und OpenType-Features über die Einstellungen oben.
    </div>

</div>

<script>
const fontContainer = document.querySelector('.font-edit-container');
const fontFamilySelect = document.getElementById('fontFamily');
const fontSizeSlider = document.getElementById('fontSize');
const fontSizeVal = document.getElementById('fontSizeVal');
const lineHeightSlider = document.getElementById('lineHeight');
const lineHeightVal = document.getElementById('lineHeightVal');
const featureCheckboxes = document.querySelectorAll('.feature');

// Update font family
fontFamilySelect.addEventListener('change', () => {
    fontContainer.style.fontFamily = fontFamilySelect.value;
});

// Update font size
fontSizeSlider.addEventListener('input', () => {
    const size = fontSizeSlider.value + 'px';
    fontSizeVal.textContent = fontSizeSlider.value;
    fontContainer.style.fontSize = size;
});

// Update line height
lineHeightSlider.addEventListener('input', () => {
    const lh = lineHeightSlider.value;
    lineHeightVal.textContent = lh;
    fontContainer.style.lineHeight = lh;
});

// Update OpenType features
featureCheckboxes.forEach(cb => {
    cb.addEventListener('change', () => {
        const activeFeatures = Array.from(featureCheckboxes)
            .filter(f => f.checked)
            .map(f => `"${f.value}" 1`)
            .join(', ');
        fontContainer.style.fontFeatureSettings = activeFeatures || 'normal';
    });
});

// Initial values
fontContainer.style.fontFamily = fontFamilySelect.value;
fontContainer.style.fontSize = fontSizeSlider.value + 'px';
fontContainer.style.lineHeight = lineHeightSlider.value;
fontContainer.style.fontFeatureSettings = 'normal';
</script>

</body>
</html>
