<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Number Art — Dense 444 Digits</title>
<style>
  
  @font-face { font-family: Regular; src: url("../fonts/ttf/Kierkegaard-Bold.ttf");}

  :root {
    --page-w: 210mm;
    --page-h: 297mm;
    --bg: #2f2f2f;
  }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg);
  }
  .page {
    position: relative;
    width: var(--page-w);
    height: var(--page-h);
    margin: 0px auto;
    overflow: hidden;
    background: var(--bg);
  }
  .digit {
    position: absolute;
    font-family: Regular;
    line-height: 1;
    transform-origin: center center;
    pointer-events: none;
    user-select: none;
  }
  @page { size: A4 portrait; margin: 0; }
</style>
</head>
<body>
  <div class="page">
    <!-- 444 digits, dense near center, larger sizes allowed -->
    <script>
      const page = document.currentScript.parentElement;
      const count = 66;
      const widthMM = 210;
      const heightMM = 290;
      function normalRandom() {
        let u = 0, v = 0;
        while(u === 0) u = Math.random();
        while(v === 0) v = Math.random();
        return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
      }
      for (let i = 0; i < count; i++) {
        const n = document.createElement('span');
        n.className = 'digit';
        n.textContent = Math.floor(Math.random()*10);
        const size = Math.max(4, Math.abs(normalRandom())*60 + 8); // up to ~200mm
        const x = 105 + normalRandom()*40; // center weighted X
        const y = 148 + normalRandom()*60; // center weighted Y
        const hue = Math.floor(Math.random()*360);
        const sat = 60 + Math.random()*30;
        const light = 60 + Math.random()*25;
        n.style.left = `${x}mm`;
        n.style.top = `${y}mm`;
        n.style.fontSize = `${size}mm`;
        n.style.color = `hsl(${hue},${sat}%,${light}%)`;
        page.appendChild(n);
      }
    </script>
  </div>
</body>
</html>
