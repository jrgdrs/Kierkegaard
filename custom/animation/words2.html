<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Word Art — Dense Words</title>
<style>

  @font-face { font-family: Regular; src: url("../fonts/ttf/Kierkegaard-Regular.ttf");}
  @font-face { font-family: Italic; src: url("../fonts/ttf/Kierkegaard-Italic.ttf");}
  @font-face { font-family: Bold; src: url("../fonts/ttf/Kierkegaard-Bold.ttf");}
  @font-face { font-family: BoldItalic; src: url("../fonts/ttf/Kierkegaard-BoldItalic.ttf");}

  :root {
    --page-w: 420mm;
    --page-h: 297mm;
    --bg: #2f2f2f;
  }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg);
  }
  .page {
    position: relative;
    width: var(--page-w);
    height: var(--page-h);
    margin: 18px auto;
    overflow: hidden;
    background: var(--bg);
  }
  .word {
    position: absolute;
    font-family: Regular;
    line-height: 1;
    transform-origin: center center;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }
@media print {

  @page { 
    size: 420mm 297mm; margin: 0; 
    display: none; 
  }
  @page:first {
    display: block; 
  }
}
</style>
</head>
<body>
  <div class="page">
    <!-- 444 words, dense near center, larger sizes allowed -->
   <script>
const page = document.currentScript.parentElement;
const count = 33;
const widthMM = 210;
const heightMM = 297;
const words = [
'dream','light','time','space','future','mind','truth','fire','stone','river','wind','shadow','echo','path','voice','heart','storm','memory','wave','field',
'sky','seed','thought','ocean','spark','dreamer','moment','vision','silence','forest','sound','cloud','mountain','dust','feather','flame','story','dreams','hope',
'soul','energy','mirror','night','day','world','circle','magic','shape','flow'
];
function normalRandom() {
let u = 0, v = 0;
while(u === 0) u = Math.random();
while(v === 0) v = Math.random();
return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}
for (let i = 0; i < count; i++) {
const w = document.createElement('span');
w.className = 'word';
w.textContent = words[Math.floor(Math.random()*words.length)];
const size = Math.max(4, Math.abs(normalRandom())*40 + 8); // up to ~200mm
const x = 105 + normalRandom()*40; // center weighted X
const y = 148 + normalRandom()*60; // center weighted Y
const hue = Math.floor(Math.random()*360);
const sat = 60 + Math.random()*30;
const light = 60 + Math.random()*25;
const alpha = 0.3 + Math.random()*0.7; // transparency 30–100%
w.style.left = `${x}mm`;
w.style.top = `${y}mm`;
w.style.fontSize = `${size}mm`;
w.style.color = `hsla(${hue},${sat}%,${light}%,${alpha})`;
page.appendChild(w);
}
</script>
  </div>
</body>
</html>
