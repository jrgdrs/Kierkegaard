<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Number Art — A4 Times Digits (solid, no rotation)</title>
<style>

    @font-face { font-family: Regular; src: url("../fonts/ttf/Kierkegaard-Regular.ttf");}

  :root {
    --page-w: 210mm;
    --page-h: 297mm;
    --bg: #dbc9c9;
  }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg);
  }
  .page {
    position: relative;
    width: var(--page-w);
    height: var(--page-h);
    margin: 18px auto;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    background: var(--bg);
  }
  .digit {
    position: absolute;
    font-family: Regular;
    line-height: 1;
    transform-origin: center center;
    pointer-events: none;
    user-select: none;
  }
  @page { size: A4 portrait; margin: 0; }
  @media print {
    html, body { background: var(--bg); }
    .page { box-shadow: none; margin: 0; left: 0; top: 0; }
  }
</style>
</head>
<body>
  <div class="page">
