<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zufällige Wörter</title>
  <style>
    html,body{height:100%;margin:0}
    body{background:#2f2f2f;overflow:hidden;font-family:"Times New Roman",Times,serif}
    #stage{position:relative;width:100%;height:100%;}
    .word{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      white-space:nowrap;pointer-events:none;user-select:none;
      transition:opacity 1s ease, filter 1s ease, transform 1s cubic-bezier(.2,.9,.2,1);
      will-change:opacity,filter,transform;
      text-rendering:optimizeLegibility;
    }
  </style>
</head>
<body>
  <div id="stage" aria-hidden="true"></div>

  <script>
  // --- Wortliste ---
  const words = [
  'dream','light','time','space','future','mind','truth','fire','stone','river','wind','shadow','echo','path','voice','heart','storm','memory','wave','field',
  'sky','seed','thought','ocean','spark','dreamer','moment','vision','silence','forest','sound','cloud','mountain','dust','feather','flame','story','dreams','hope',
  'soul','energy','mirror','night','day','world','circle','magic','shape','flow'
  ];

  // --- Ausgereifter RNG: xorshift128+ (initialisiert via crypto) ---
  (function(){
    function XorShift128Plus(a,b,c,d){
      this.s = new Uint32Array(4);
      this.s[0]=a|0; this.s[1]=b|0; this.s[2]=c|0; this.s[3]=d|0;
    }
    XorShift128Plus.prototype.next = function(){
      // returns unsigned 32-bit
      let s0 = this.s[0]>>>0, s1 = this.s[1]>>>0, s2 = this.s[2]>>>0, s3 = this.s[3]>>>0;
      let t = (s0 ^ (s0 << 11)) >>> 0;
      this.s[0] = s1;
      this.s[1] = s2;
      this.s[2] = s3;
      this.s[3] = ( (s3 ^ (s3 >>> 19)) ^ (t ^ (t >>> 8)) ) >>> 0;
      return (this.s[3] + s3) >>> 0;
    };
    XorShift128Plus.prototype.random = function(){
      // float in [0,1)
      return (this.next() >>> 0) / 4294967296;
    };
    // seed with strong crypto
    const seedArr = new Uint32Array(4);
    crypto.getRandomValues(seedArr);
    window._rng = new XorShift128Plus(seedArr[0],seedArr[1],seedArr[2],seedArr[3]);

    // Gaussian via Box-Muller using _rng
    window.gaussian = (function(){
      let spare = null;
      return function(mean=0, sd=1){
        if(spare !== null){ let val = spare; spare = null; return mean + sd*val; }
        let u, v, s;
        do{
          u = window._rng.random()*2 - 1;
          v = window._rng.random()*2 - 1;
          s = u*u + v*v;
        } while(s === 0 || s >= 1);
        const mul = Math.sqrt(-2*Math.log(s)/s);
        spare = v * mul;
        return mean + sd * (u * mul);
      };
    })();

  })();

  // --- Hauptlogik ---
  const stage = document.getElementById('stage');
  const maxVisible = 30;
  const addInterval = 2000; // ms
  let visibleWords = [];
  let zIndex = 1;

  function pickRandom(arr){ return arr[Math.floor(window._rng.random()*arr.length)]; }

  function randomHue(){ return Math.floor(window._rng.random()*360); }

  function pickFontVariant(){
    const variants = [ {style:'normal', weight:'400'}, {style:'italic', weight:'400'}, {style:'normal', weight:'700'}, {style:'italic', weight:'700'} ];
    return variants[Math.floor(window._rng.random()*variants.length)];
  }

  function createWordElement(text){
    const el = document.createElement('div');
    el.className = 'word';
    el.textContent = text;

    // font, size
    const variant = pickFontVariant();
    el.style.fontStyle = variant.style;
    el.style.fontWeight = variant.weight;

    const sizePt = 20 + Math.floor(window._rng.random() * (200-20 + 1));
    el.style.fontSize = sizePt + 'pt';

    // color from hue
    const hue = randomHue();
    el.style.color = `hsl(${hue} 100% 60%)`;

    // initial transform/position: we will compute final position relative to center
    const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
    const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
    const centerX = vw/2;
    const centerY = vh/2;

    // normal distribution around center
    const sigma = Math.min(vw,vh) * 0.18; // stddev
    const x = gaussian(centerX, sigma);
    const y = gaussian(centerY, sigma);

    // set transform to position; we'll translate by (-50%,-50%) in CSS so left/top are absolute
    // Use px for left/top
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.zIndex = (++zIndex).toString();

    // opacity target (random between 0.5 and 1)
    const targetOpacity = 0.5 + window._rng.random()*0.5;
    el.dataset.targetOpacity = targetOpacity;

    // blur start/transition values
    const startBlur = 8 + Math.floor(window._rng.random()*24); // px
    el.dataset.startBlur = startBlur;

    // start invisible and blurred
    el.style.opacity = '0';
    el.style.filter = `blur(${startBlur}px)`;

    return el;
  }

  function showWord(){
    const w = pickRandom(words);
    const el = createWordElement(w);
    stage.appendChild(el);
    visibleWords.push(el);

    // force reflow then animate to visible
    requestAnimationFrame(()=>{
      // ensure placement stays within viewport by nudging if necessary
      ensureInViewport(el);
      // animate to sharp and partially/fully opaque
      el.style.opacity = el.dataset.targetOpacity;
      el.style.filter = 'blur(0px)';
      // a small random scale for life
      const scale = 0.92 + window._rng.random()*0.36; // 0.92 - 1.28
      el.style.transform = `translate(-50%,-50%) scale(${scale})`;
    });

    // If too many on screen, schedule fade out of oldest so count stays <= maxVisible
    if(visibleWords.length > maxVisible){
      // remove oldest
      const old = visibleWords.shift();
      fadeOutAndRemove(old);
    }
  }

  function fadeOutAndRemove(el){
    if(!el) return;
    // animate back to transparent and blurred
    const endBlur = 8 + Math.floor(window._rng.random()*36);
    el.style.opacity = '0';
    el.style.filter = `blur(${endBlur}px)`;
    // after transition remove
    const cleanup = ()=>{ if(el && el.parentElement) el.parentElement.removeChild(el); el.removeEventListener('transitionend',cleanup); };
    el.addEventListener('transitionend', cleanup);
  }

  function ensureInViewport(el){
    const rect = el.getBoundingClientRect();
    const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
    const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
    let left = rect.left;
    let top = rect.top;
    let changed = false;
    if(rect.left < 0) { left = rect.width/2; changed=true; }
    if(rect.right > vw) { left = vw - rect.width/2; changed=true; }
    if(rect.top < 0) { top = rect.height/2; changed=true; }
    if(rect.bottom > vh) { top = vh - rect.height/2; changed=true; }
    if(changed){
      // set left/top centered point
      el.style.left = (left + rect.width/2) + 'px';
      el.style.top = (top + rect.height/2) + 'px';
    }
  }

  // Start interval
  const intervalId = setInterval(showWord, addInterval);
  // show one immediately
  showWord();

  // Remove words periodically too if user wants steady-state removal even before hitting maxVisible
  // We'll maintain that after the first 30 are present, removals occur at the same rate as additions (handled above).

  // Responsiveness: on resize, nudge existing words to remain near center
  window.addEventListener('resize', ()=>{
    visibleWords.forEach(el=>{
      // small random drift toward center
      const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
      const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
      const centerX = vw/2, centerY = vh/2;
      const sigma = Math.min(vw,vh)*0.18;
      const x = gaussian(centerX, sigma);
      const y = gaussian(centerY, sigma);
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    });
  });

  // Accessibility: pause animations on reduced-motion
  const media = window.matchMedia('(prefers-reduced-motion: reduce)');
  if(media.matches){
    clearInterval(intervalId);
    // make existing words static and visible
    visibleWords.forEach(el=>{ el.style.opacity = el.dataset.targetOpacity; el.style.filter='none'; el.style.transition='none'; });
  }

  </script>
</body>
</html>
