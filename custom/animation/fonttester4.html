<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Parametrisierbarer Font-Tester</title>
<style>
/* -------------------- Fonts -------------------- */
@font-face { font-family: Regular; src: url("../fonts/ttf/Kierkegaard-Regular.ttf"); }
@font-face { font-family: Italic; src: url("../fonts/ttf/Kierkegaard-Italic.ttf"); }
@font-face { font-family: SemiBold; src: url("../fonts/ttf/Kierkegaard-SemiBold.ttf"); }
@font-face { font-family: SemiBoldItalic; src: url("../fonts/ttf/Kierkegaard-SemiBoldItalic.ttf"); }
@font-face { font-family: ExtraBold; src: url("../fonts/ttf/Kierkegaard-ExtraBold.ttf"); }
@font-face { font-family: ExtraBoldItalic; src: url("../fonts/ttf/Kierkegaard-ExtraBoldItalic.ttf"); }

/* -------------------- Styling für alle Font-Tester Instanzen -------------------- */
.font-tester {
    margin-bottom: 30px;
}
.font-tester .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 10px;
    background: #fff;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
}
.font-tester .controls > div {
    margin: 0;
}
.font-tester .controls label {
    display: block;
    margin-bottom: 3px;
    font-weight: normal;
    font-size: 12px;
    color: #888;
}
.font-tester .controls select,
.font-tester .controls input[type="range"] {
    width: 120px;
}

.font-tester .features {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.font-tester .features label {
    font-size: 12px;
    color: #888;
    display: flex;
    align-items: center;
    gap: 3px;
}

.font-tester .font-edit-container {
    background: #fff;
    padding: 15px;
    min-height: 150px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    overflow-y: auto;
}
.font-tester .font-edit-container[contenteditable="true"] {
    outline: 2px dashed #ccc;
    cursor: text;
}

/* Slider Styling */
input[type="range"] {
    -webkit-appearance: none;
    height: 5px;
    background: #ddd;
    border-radius: 5px;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    background: #666;
    border-radius: 50%;
    cursor: pointer;
}
</style>
</head>
<body>

<div id="tester1"></div>
<div id="tester2"></div>

<script>
function createFontTester(options) {
    const {
        container,
        fonts,
        initialFont,
        initialSize,
        initialLineHeight,
        features,
        initialFeatures,
        sampleText
    } = options;

    // Wrapper erstellen
    const wrapper = document.createElement('div');
    wrapper.className = 'font-tester';
    container.appendChild(wrapper);

    // Controls Container
    const controls = document.createElement('div');
    controls.className = 'controls';
    wrapper.appendChild(controls);

    // ----- Font Family Select -----
    const fontDiv = document.createElement('div');
    const fontLabel = document.createElement('label');
    fontLabel.textContent = 'Font Family';
    fontDiv.appendChild(fontLabel);
    const fontSelect = document.createElement('select');
    fonts.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f;
        opt.textContent = f;
        fontSelect.appendChild(opt);
    });
    fontSelect.value = initialFont;
    fontDiv.appendChild(fontSelect);
    controls.appendChild(fontDiv);

    // ----- Font Size Slider -----
    const sizeDiv = document.createElement('div');
    const sizeLabel = document.createElement('label');
    sizeLabel.innerHTML = `Font Size (<span>${initialSize}</span>px)`;
    const sizeSpan = sizeLabel.querySelector('span');
    sizeDiv.appendChild(sizeLabel);
    const sizeSlider = document.createElement('input');
    sizeSlider.type = 'range';
    sizeSlider.min = 8;
    sizeSlider.max = 72;
    sizeSlider.value = initialSize;
    sizeDiv.appendChild(sizeSlider);
    controls.appendChild(sizeDiv);

    // ----- Line Height Slider -----
    const lhDiv = document.createElement('div');
    const lhLabel = document.createElement('label');
    lhLabel.innerHTML = `Line Height (<span>${initialLineHeight}</span>)`;
    const lhSpan = lhLabel.querySelector('span');
    lhDiv.appendChild(lhLabel);
    const lhSlider = document.createElement('input');
    lhSlider.type = 'range';
    lhSlider.min = 1;
    lhSlider.max = 3;
    lhSlider.step = 0.1;
    lhSlider.value = initialLineHeight;
    lhDiv.appendChild(lhSlider);
    controls.appendChild(lhDiv);

    // ----- OpenType Features Checkboxes -----
    const featDiv = document.createElement('div');
    const featLabel = document.createElement('label');
    featLabel.textContent = 'OpenType Features';
    featDiv.appendChild(featLabel);
    const featContainer = document.createElement('div');
    featContainer.className = 'features';
    features.forEach(f => {
        const lab = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = f;
        if(initialFeatures.includes(f)) cb.checked = true;
        lab.appendChild(cb);
        lab.appendChild(document.createTextNode(f));
        featContainer.appendChild(lab);

        cb.addEventListener('change', updateFeatures);
    });
    featDiv.appendChild(featContainer);
    controls.appendChild(featDiv);

    // ----- Editable Text -----
    const textDiv = document.createElement('div');
    textDiv.className = 'font-edit-container';
    textDiv.contentEditable = 'true';
    textDiv.textContent = sampleText;
    wrapper.appendChild(textDiv);

    // ----- Funktionen zur Aktualisierung -----
    function updateFeatures() {
        const selected = Array.from(featContainer.querySelectorAll('input:checked'))
            .map(cb => `"${cb.value}" 1`);
        textDiv.style.fontFeatureSettings = selected.join(', ') || 'normal';
    }

    fontSelect.addEventListener('change', () => {
        textDiv.style.fontFamily = fontSelect.value;
    });
    sizeSlider.addEventListener('input', () => {
        textDiv.style.fontSize = sizeSlider.value + 'px';
        sizeSpan.textContent = sizeSlider.value;
    });
    lhSlider.addEventListener('input', () => {
        textDiv.style.lineHeight = lhSlider.value;
        lhSpan.textContent = lhSlider.value;
    });

    // Initial Styling
    textDiv.style.fontFamily = fontSelect.value;
    textDiv.style.fontSize = sizeSlider.value + 'px';
    textDiv.style.lineHeight = lhSlider.value;
    updateFeatures();

    return wrapper;
}

// ----- Beispiel: zwei parallele Font-Tester -----
createFontTester({
    container: document.getElementById('tester1'),
    fonts: ['Regular','Italic','SemiBold','SemiBoldItalic'],
    initialFont: 'Regular',
    initialSize: 24,
    initialLineHeight: 1.5,
    features: ['liga','dlig','smcp','calt','onum','lnum'],
    initialFeatures: ['liga','smcp'],
    sampleText: 'Dies ist der erste Beispieltext.'
});

createFontTester({
    container: document.getElementById('tester2'),
    fonts: ['ExtraBold','ExtraBoldItalic','Regular'],
    initialFont: 'ExtraBold',
    initialSize: 28,
    initialLineHeight: 1.6,
    features: ['liga','dlig','smcp','calt'],
    initialFeatures: ['calt'],
    sampleText: 'Zweiter Testtext mit anderem Font.'
});
</script>

</body>
</html>
