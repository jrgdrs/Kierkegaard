<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Font-Tester mit Toggle</title>
<style>
/* -------------------- Fonts -------------------- */
@font-face { font-family: Kierkegaard-Regular; src: url("../fonts/ttf/Kierkegaard-Regular.ttf"); }
@font-face { font-family: Kierkegaard-Italic; src: url("../fonts/ttf/Kierkegaard-Italic.ttf"); }
@font-face { font-family: Kierkegaard-SemiBold; src: url("../fonts/ttf/Kierkegaard-SemiBold.ttf"); }
@font-face { font-family: Kierkegaard-SemiBoldItalic; src: url("../fonts/ttf/Kierkegaard-SemiBoldItalic.ttf"); }
@font-face { font-family: Kierkegaard-ExtraBold; src: url("../fonts/ttf/Kierkegaard-ExtraBold.ttf"); }
@font-face { font-family: Kierkegaard-ExtraBoldItalic; src: url("../fonts/ttf/Kierkegaard-ExtraBoldItalic.ttf"); }

/* -------------------- Styling -------------------- */
.font-tester {
    margin-bottom: 30px;
    border-radius: 8px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    background: #fff;
}
.font-tester .header {
    display: flex;
    align-items: center;
    padding: 5px 10px;
    background: #f0f0f0;
    cursor: pointer;
    user-select: none;
}
.font-tester .header .title {
    font-size: 12pt;
    font-weight: bold;
    margin-left: 10px;
}
.font-tester .header .subtitle {
    font-size: 12px;
    font-weight: normal;
    color: #666;
    margin-left: 10px;
}

.font-tester .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    padding: 10px;
    transition: height 0.2s, opacity 0.2s;
}
.font-tester .controls.hidden {
    height: 0;
    opacity: 0;
    overflow: hidden;
    padding: 0 10px;
}

.font-tester .controls > div {
    margin: 0;
}
.font-tester .controls label {
    display: block;
    margin-bottom: 3px;
    font-weight: normal;
    font-size: 12px;
    color: #888;
}
.font-tester .controls select,
.font-tester .controls input[type="range"] {
    width: 120px;
}

.font-tester .features {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.font-tester .features label {
    font-size: 12px;
    color: #888;
    display: flex;
    align-items: center;
    gap: 3px;
}

.font-tester .font-edit-container {
    background: #fff;
    padding: 15px;
    _min-height: 150px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    overflow-y: auto;
}
.font-tester .font-edit-container[contenteditable="true"] {
    _outline: 2px dashed #ccc;
    cursor: text;
}

/* Slider Styling */
input[type="range"] {
    -webkit-appearance: none;
    height: 5px;
    background: #ddd;
    border-radius: 5px;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    background: #666;
    border-radius: 50%;
    cursor: pointer;
}
</style>
</head>
<body>

<div id="tester1"></div>
<div id="tester2"></div>

<script>
function createFontTester(options) {
    const {
        container,
        fonts,
        initialFont,
        initialSize,
        initialLineHeight,
        features,
        initialFeatures,
        sampleText
    } = options;

    const wrapper = document.createElement('div');
    wrapper.className = 'font-tester';
    container.appendChild(wrapper);

    // ----- Header mit Toggle -----
    const header = document.createElement('div');
    header.className = 'header';
    const toggleBtn = document.createElement('button');
    toggleBtn.textContent = '▾';
    toggleBtn.style.cursor = 'pointer';
    toggleBtn.style.fontSize = '18px';
    toggleBtn.style.color = 'white';
    toggleBtn.style.padding = '0px 6px';
    toggleBtn.style.border = 'none';
    toggleBtn.style.background = 'limegreen';
    toggleBtn.style.fontWeight = 'bold';
    header.appendChild(toggleBtn);

    const titleSpan = document.createElement('span');
    titleSpan.className = 'title';
    header.appendChild(titleSpan);

    const subtitleSpan = document.createElement('span');
    subtitleSpan.className = 'subtitle';
    header.appendChild(subtitleSpan);

    wrapper.appendChild(header);

    // ----- Controls -----
    const controls = document.createElement('div');
    controls.className = 'controls';
    wrapper.appendChild(controls);

    // Font Family
    const fontDiv = document.createElement('div');
    const fontLabel = document.createElement('label'); fontLabel.textContent='Font Family';
    fontDiv.appendChild(fontLabel);
    const fontSelect = document.createElement('select');
    fonts.forEach(f=>{const opt=document.createElement('option');opt.value=f;opt.textContent=f;fontSelect.appendChild(opt)});
    fontSelect.value = initialFont;
    fontDiv.appendChild(fontSelect);
    controls.appendChild(fontDiv);

    // Font Size
    const sizeDiv = document.createElement('div');
    const sizeLabel = document.createElement('label'); sizeLabel.innerHTML=`Font Size (<span>${initialSize}</span>px)`; const sizeSpan=sizeLabel.querySelector('span');
    sizeDiv.appendChild(sizeLabel);
    const sizeSlider = document.createElement('input'); sizeSlider.type='range'; sizeSlider.min=12; sizeSlider.max=144; sizeSlider.value=initialSize;
    sizeDiv.appendChild(sizeSlider);
    controls.appendChild(sizeDiv);

    // Line Height
    const lhDiv = document.createElement('div');
    const lhLabel = document.createElement('label'); lhLabel.innerHTML=`Line Height (<span>${initialLineHeight}</span>)`; const lhSpan=lhLabel.querySelector('span');
    lhDiv.appendChild(lhLabel);
    const lhSlider = document.createElement('input'); lhSlider.type='range'; lhSlider.min=.5; lhSlider.max=1.5; lhSlider.step=0.1; lhSlider.value=initialLineHeight;
    lhDiv.appendChild(lhSlider);
    controls.appendChild(lhDiv);

    // Features Checkboxes
    const featDiv = document.createElement('div');
    const featLabel = document.createElement('label'); featLabel.textContent='OpenType Features';
    featDiv.appendChild(featLabel);
    const featContainer = document.createElement('div'); featContainer.className='features';
    features.forEach(f=>{
        const lab=document.createElement('label');
        const cb=document.createElement('input'); cb.type='checkbox'; cb.value=f; if(initialFeatures.includes(f)) cb.checked=true;
        lab.appendChild(cb); lab.appendChild(document.createTextNode(f));
        featContainer.appendChild(lab);
        cb.addEventListener('change', updateFeatures);
    });
    featDiv.appendChild(featContainer);
    controls.appendChild(featDiv);

    // Editable Text
    const textDiv = document.createElement('div'); textDiv.className='font-edit-container'; textDiv.contentEditable=true; textDiv.textContent=sampleText;
    wrapper.appendChild(textDiv);

    // ----- Update Funktionen -----
    function updateFeatures(){
        const selected = Array.from(featContainer.querySelectorAll('input:checked')).map(cb=>`"${cb.value}" 1`);
        textDiv.style.fontFeatureSettings = selected.join(',') || 'normal';
        updateHeaderText();
    }
    function updateHeaderText(){
        const selectedFeatures = Array.from(featContainer.querySelectorAll('input:checked')).map(cb=>cb.value);
        titleSpan.textContent = fontSelect.value;
        subtitleSpan.textContent = `Size ${sizeSlider.value}px, Line ${lhSlider.value}` + (selectedFeatures.length>0 ? ` (${selectedFeatures.join(', ')})` : '');
    }

    fontSelect.addEventListener('change', ()=>{ textDiv.style.fontFamily=fontSelect.value; updateHeaderText(); });
    sizeSlider.addEventListener('input', ()=>{ textDiv.style.fontSize=sizeSlider.value+'px'; sizeSpan.textContent=sizeSlider.value; updateHeaderText(); });
    lhSlider.addEventListener('input', ()=>{ textDiv.style.lineHeight=lhSlider.value; lhSpan.textContent=lhSlider.value; updateHeaderText(); });

    // ----- Toggle Controls -----
    // let visible=true;  
    // toggleBtn.addEventListener('click', ()=>{
    //     visible=!visible;
    //     controls.classList.toggle('hidden',!visible);
    //     toggleBtn.textContent = visible ? '▾' : '▸';
    // });

    let visible = false; // Controls starten ausgeblendet
    controls.classList.add('hidden'); // verstecken
    toggleBtn.textContent = '▸'; // Pfeil für versteckt

    header.addEventListener('click', ()=>{
        visible = !visible;
        controls.classList.toggle('hidden', !visible);
        toggleBtn.textContent = visible ? '▾' : '▸';
    });

    // Initial
    textDiv.style.fontFamily=fontSelect.value;
    textDiv.style.fontSize=sizeSlider.value+'px';
    textDiv.style.lineHeight=lhSlider.value;
    updateFeatures();
}

// ----- Beispiel -----
createFontTester({
    container: document.getElementById('tester1'),
    fonts: ['Kierkegaard-Regular','Kierkegaard-Italic','Kierkegaard-SemiBold','Kierkegaard-SemiBoldItalic'],
    initialFont: 'Kierkegaard-Regular',
    initialSize: 48,
    initialLineHeight: 1,
    features: ['liga','dlig','smcp','calt','onum','lnum'],
    initialFeatures: ['liga','smcp'],
    sampleText: 'Dies ist der erste Beispieltext.'
});

createFontTester({
    container: document.getElementById('tester2'),
    fonts: ['Kierkegaard-ExtraBold','Kierkegaard-ExtraBoldItalic','Kierkegaard-Regular'],
    initialFont: 'Kierkegaard-ExtraBold',
    initialSize: 28,
    initialLineHeight: 1,
    features: ['liga','dlig','smcp','calt'],
    initialFeatures: ['calt'],
    sampleText: 'Zweiter Testtext mit anderem Font.'
});
</script>

</body>
</html>
